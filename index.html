function save(){S.last=Date.now();localStorage.setItem('mia-santfruitos-v3',JSON.stringify(S));updateUI()}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function updateUI(){money.textContent=Math.floor(S.money).toLocaleString('es-ES');fame.textContent=S.fame;energy.textContent=Math.floor(S.energy)}

function drawTown(){const sx=W/640,sy=H/640,sc=Math.min(sx,sy);ctx.save();ctx.scale(sx,sy);ctx.fillStyle='#b8dca9';ctx.fillRect(0,0,640,640);ctx.fillStyle='#d7d4d0';ctx.fillRect(0,255,640,95);ctx.fillRect(180,0,90,640);ctx.fillRect(390,0,82,640);ctx.fillRect(0,470,640,70);ctx.fillStyle='#f3eddf';ctx.fillRect(0,275,640,55);ctx.fillRect(198,0,54,640);ctx.fillRect(404,0,54,640);ctx.fillRect(0,484,640,42);ctx.setLineDash([16,14]);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,302);ctx.lineTo(640,302);ctx.moveTo(225,0);ctx.lineTo(225,640);ctx.moveTo(431,0);ctx.lineTo(431,640);ctx.moveTo(0,505);ctx.lineTo(640,505);ctx.stroke();ctx.setLineDash([]);
ctx.font='bold 10px system-ui';ctx.fillStyle='#6e6870';ctx.fillText('CARRETERA DE VIC',275,272);ctx.fillText('C. DEL PADRÓ',185,28);ctx.fillText('AV. SANT JOAN',392,28);ctx.fillText('CARRER BARCELONA',470,475);
for(const b of buildings){roundRect(b.x,b.y,b.w,b.h,14,b.color);ctx.fillStyle='#fff8';ctx.fillRect(b.x+8,b.y+10,b.w-16,20);ctx.fillStyle='#31252b';ctx.font='900 12px system-ui';ctx.fillText(b.name,b.x+12,b.y+25);ctx.font='8px system-ui';ctx.fillText(b.sub,b.x+12,b.y+39);ctx.fillStyle='#50363f';ctx.fillRect(b.doorX,b.doorY-14,24,14);for(let i=0;i<3;i++){ctx.fillStyle='#bde2ef';ctx.fillRect(b.x+14+i*35,b.y+52,23,22)}}
for(let i=0;i<18;i++){const tx=(i*93+33)%620,ty=(i*157+18)%620;if(tx>170&&tx<480)continue;ctx.font='23px serif';ctx.fillText('🌳',tx,ty)}
ctx.restore();drawPlayer(sx,sy)}
function drawInterior(){ctx.fillStyle='#f7e9e4';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(16,16,W-32,H-32);ctx.fillStyle='#e8c7b8';ctx.fillRect(0,H*.72,W,H*.28);ctx.fillStyle='#d28aa1';ctx.fillRect(W*.08,H*.14,W*.84,46);ctx.fillStyle='#fff';ctx.font='900 18px system-ui';ctx.fillText(S.scene==='shop'?'MÍA MODAS · CARRETERA DE VIC, 26':S.scene.toUpperCase(),W*.14,H*.14+30);
const objs=S.scene==='shop'?[['👗','Perchero vestidos',.18,.38],['👚','Camisetas',.46,.38],['👖','Pantalones',.74,.38],['🪞','Probador',.18,.63],['💳','Caja',.50,.63],['📦','Pedidos',.78,.63]]:[['📸','Sesión de fotos',.28,.43],['🎥','Directo',.68,.43],['✨','Campaña',.50,.66]];for(const o of objs){ctx.font='44px serif';ctx.textAlign='center';ctx.fillText(o[0],W*o[2],H*o[3]);ctx.font='10px system-ui';ctx.fillStyle='#4b3a41';ctx.fillText(o[1],W*o[2],H*o[3]+18)}ctx.textAlign='start';drawPlayer(W/640,H/640)}
function drawPlayer(sx,sy){const px=S.x*sx,py=S.y*sy;ctx.save();ctx.translate(px,py);ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(0,13,13,6,0,0,7);ctx.fill();ctx.font='31px serif';ctx.textAlign='center';ctx.fillText(S.equipped?'💃':'👩‍🦰',0,7);ctx.restore()}
function render(){ctx.clearRect(0,0,W,H);if(S.scene==='town')drawTown();else drawInterior();requestAnimationFrame(render)}render();
let vx=0,vy=0,lastT=performance.now();function tick(t){let dt=Math.min(.04,(t-lastT)/1000);lastT=t;if(vx||vy){S.x=Math.max(18,Math.min(622,S.x+vx*130*dt));S.y=Math.max(25,Math.min(610,S.y+vy*130*dt));S.energy=Math.max(0,S.energy-dt*.15)}requestAnimationFrame(tick)}requestAnimationFrame(tick);
const joy=document.getElementById('joy'),knob=document.getElementById('knob');function joyMove(e){const r=joy.getBoundingClientRect(),p=e.touches?e.touches[0]:e,dx=p.clientX-(r.left+r.width/2),dy=p.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy)||1,k=Math.min(32,m);vx=dx/m;vy=dy/m;knob.style.transform=`translate(${vx*k}px,${vy*k}px)`}function joyEnd(){vx=vy=0;knob.style.transform=''}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.buttons)joyMove(e)});joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);

function propertyCard(p,type){const owned=(type==='prop'?S.ownedProps:S.ownedBiz).includes(p.id);return `<div class="card"><h3>${p.icon} ${p.name}</h3><p>${p.desc}</p><p class="price">${p.price.toLocaleString()} € · +${p.income} €/día</p><button class="buy" ${owned?'disabled':''} onclick="buyProperty('${p.id}','${type}')">${owned?'Comprado':'Comprar'}</button></div>`}
function buyStock(i){const c=clothes[i];if(S.money<c[2])return toast('No tienes suficiente dinero');S.money-=c[2];S.stock[i]=(S.stock[i]||0)+1;S.missions.buy5++;S.fame++;save();openSheet('fashion');toast('Has comprado '+c[0])}
function sellRandom(){const ids=Object.keys(S.stock).filter(i=>S.stock[i]>0);if(!ids.length)return toast('No tienes ropa en stock');const i=+ids[Math.floor(Math.random()*ids.length)],c=clothes[i],bonus=1+S.fame/300,earn=Math.floor(c[3]*bonus);S.stock[i]--;S.money+=earn;S.sales++;S.customers++;S.missions.sale3++;S.fame+=2;save();openSheet('fashion');toast('🛍️ Venta de '+earn+' €')}
function buyProperty(id,type){const list=type==='prop'?properties:businesses,p=list.find(x=>x.id===id),arr=type==='prop'?S.ownedProps:S.ownedBiz;if(arr.includes(id))return;if(S.money<p.price)return toast('Todavía no tienes suficiente dinero');S.money-=p.price;arr.push(id);S.fame+=15;save();openSheet('properties');toast('🎉 Has comprado '+p.name)}
function dailyIncome(){return 120+S.ownedProps.reduce((a,id)=>a+properties.find(p=>p.id===id).income,0)+S.ownedBiz.reduce((a,id)=>a+businesses.find(p=>p.id===id).income,0)}
function nextDay(){S.day++;S.money+=dailyIncome();S.energy=100;S.fame+=2;save();openSheet('business');toast('Día '+S.day+': ingresos cobrados')}
function doPhoto(){if(S.energy<12)return toast('Necesitas descansar');S.energy-=12;S.photos++;S.missions.photo++;let gain=40+Math.floor(Math.random()*90);S.followers+=gain;S.fame+=4;S.money+=60;save();toast('📸 Sesión perfecta: +'+gain+' seguidores y 60 €')}
function postSocial(){if(S.energy<8)return toast('Necesitas energía');S.energy-=8;let n=20+Math.floor(Math.random()*70);S.followers+=n;S.fame+=2;save();openSheet('phone');toast('Publicación viral: +'+n+' seguidores')}
function onlineOrder(){const ids=Object.keys(S.stock).filter(i=>S.stock[i]>0);if(!ids.length)return toast('Compra ropa para preparar pedidos');const i=+ids[Math.floor(Math.random()*ids.length)];S.stock[i]--;let e=clothes[i][3]+15;S.money+=e;S.sales++;S.missions.sale3++;S.energy=Math.max(0,S.energy-6);save();openSheet('phone');toast('📦 Pedido enviado: +'+e+' €')}
function spin(){const key='spin'+S.day;if(S[key])return toast('Ya has girado hoy');S[key]=1;const prizes=[100,180,250,500];const p=prizes[Math.floor(Math.random()*prizes.length)];S.money+=p;save();openSheet('phone');toast('🎡 Premio: '+p+' €')}
function loan(){if(S.loan)return toast('Ya tienes un crédito activo');S.money+=3000;S.loan=1;save();openSheet('phone');toast('Banco: +3.000 € para crecer')}
function claimMission(i){const keys=['sale3','buy5','visit','photo'],goals=[3,5,4,3],rewards=[300,250,350,450],k=keys[i];if(S.missions[k]<goals[i])return;S.missions[k]-=goals[i];S.money+=rewards[i];S.fame+=5;save();openSheet('missions');toast('Misión completada')}
function teleport(i){const pts=[[310,335],[215,115],[225,440],[95,500],[430,180],[520,500]];S.scene='town';[S.x,S.y]=pts[i];S.missions.visit++;save();modal.classList.remove('open');toast('Has viajado a '+streets[i])}
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSheet(b.dataset.open));
setInterval(()=>{S.money+=dailyIncome()/600;save()},10000);updateUI();
</script></body></html>
