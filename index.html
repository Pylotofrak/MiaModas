function renderBusiness(){openModal('🏪 Tu imperio de moda',`<div class="grid">${businesses.map(b=>`<div class="card property ${S.ownedBiz.includes(b.id)?'':'locked'}"><div class="hero">${b.icon}</div><h3>${b.name}</h3><p>${b.desc}</p><p class="price">${b.price?b.price.toLocaleString()+' €':'Tu tienda'} · +${b.income.toLocaleString()} €/día</p><button class="btn" data-biz="${b.id}" ${S.ownedBiz.includes(b.id)?'disabled':''}>${S.ownedBiz.includes(b.id)?'Ya es tuya':'Comprar negocio'}</button></div>`).join('')}</div>`);body.querySelectorAll('[data-biz]').forEach(x=>x.onclick=()=>{const b=businesses.find(v=>v.id===x.dataset.biz);if(S.money<b.price)return toast('Todavía tienes que ahorrar más');S.money-=b.price;S.ownedBiz.push(b.id);S.fame+=25;gainXP(40);toast(`🎉 Has abierto ${b.name}`);save();renderBusiness()})}
function renderHomes(){openModal('🏠 Casas y propiedades',`<div class="grid">${homes.map(h=>`<div class="card property ${S.ownedHomes.includes(h.id)?'':'locked'}"><div class="hero">${h.icon}</div><h3>${h.name}</h3><p>${h.desc}</p><p class="price">${h.price.toLocaleString()} € · +${h.income} €/día</p><button class="btn" data-home="${h.id}" ${S.ownedHomes.includes(h.id)?'disabled':''}>${S.ownedHomes.includes(h.id)?'Ya es tuya':'Comprar casa'}</button></div>`).join('')}</div>`);body.querySelectorAll('[data-home]').forEach(x=>x.onclick=()=>{const h=homes.find(v=>v.id===x.dataset.home);if(S.money<h.price)return toast('Necesitas ahorrar más dinero');S.money-=h.price;S.ownedHomes.push(h.id);S.fame+=15;S.energy=Math.min(100,S.energy+h.energy);toast(`🔑 Has comprado ${h.name}`);save();renderHomes()})}
function renderMissions(){const q=S.quest;openModal('🎯 Retos y logros',`<div class="card"><div class="row"><div><h3>Misión del día</h3><p>${questText()}</p></div><span class="badge">${q.done>=q.goal?'COMPLETA':'EN CURSO'}</span></div><div class="bar"><i style="width:${Math.min(100,q.done/q.goal*100)}%"></i></div><button class="btn gold" id="claim" ${q.done<q.goal||q.claimed?'disabled':''}>${q.claimed?'Premio cobrado':'Cobrar 1.500 €'}</button></div><div class="grid" style="margin-top:10px">${[['Primera venta','🧾',S.sales>=1],['Reina de redes','📱',S.followers>=5000],['Empresaria','🏪',S.ownedBiz.length>=3],['Gran propietaria','🏡',S.ownedHomes.length>=3],['Diseñadora','✂️',S.designs>=10],['Icono de moda','💎',S.fame>=150]].map(a=>`<div class="card ${a[2]?'':'locked'}"><div class="hero">${a[1]}</div><h3>${a[0]}</h3><p>${a[2]?'Conseguido':'Bloqueado'}</p></div>`).join('')}</div>`);claim.onclick=()=>{if(q.done<q.goal||q.claimed)return;q.claimed=true;S.money+=1500;S.coins++;toast('🎁 Premio cobrado');save();renderMissions()}}
function renderPhone(){openModal('📱 Tu móvil',`<div class="grid"><div class="card"><div class="hero">📸</div><h3>Instagram</h3><p>${S.followers.toLocaleString()} seguidores</p><button class="btn" id="post">Publicar campaña</button></div><div class="card"><div class="hero">📦</div><h3>Pedidos online</h3><p>${S.orders} pedidos enviados</p><button class="btn" id="order">Preparar pedido</button></div><div class="card"><div class="hero">🎡</div><h3>Ruleta diaria</h3><p>${S.coins} monedas</p><button class="btn gold" id="spin" ${S.coins<1?'disabled':''}>Girar</button></div><div class="card"><div class="hero">🌅</div><h3>Cerrar el día</h3><p>Cobra ingresos de tus propiedades.</p><button class="btn dark" id="next">Día siguiente</button></div></div>`);post.onclick=()=>{photoSession();renderPhone()};order.onclick=()=>{prepareOrder();renderPhone()};spin.onclick=()=>{if(S.coins<1)return;S.coins--;const p=[400,700,1200,2500][Math.floor(Math.random()*4)];S.money+=p;toast(`🎉 Has ganado ${p} €`);save();renderPhone()};next.onclick=nextDay}
function nextDay(){let inc=0;S.ownedBiz.forEach(id=>inc+=businesses.find(b=>b.id===id).income);S.ownedHomes.forEach(id=>inc+=homes.find(h=>h.id===id).income);S.money+=inc;S.day++;S.hour=10;S.energy=100;S.weather=['Soleado','Nubes','Lluvia suave','Soleado'][Math.floor(Math.random()*4)];const types=['sales','orders','photos','customers'];S.quest={type:types[Math.floor(Math.random()*types.length)],goal:3+Math.floor(Math.random()*5),done:0,claimed:false};toast(`🌅 Nuevo día: +${inc.toLocaleString()} €`);save();renderPhone()}
function renderProfile(){openModal('💖 Mi vida',`<div class="profile"><div class="avatarBig">👩🏼‍🦱</div><div><h3>Nivel ${S.level}</h3><p>Fama ${S.fame} · Ventas ${S.sales}</p><p>Clientas ${S.customers} · Diseños ${S.designs}</p><div class="bar"><i style="width:${S.xp/(S.level*100)*100}%"></i></div></div></div><div class="grid" style="margin-top:12px"><div class="card"><div class="hero">💃</div><h3>Desfile</h3><p>Compite con tus mejores looks.</p><button class="btn" id="runway">Participar</button></div><div class="card"><div class="hero">✂️</div><h3>Diseñar colección</h3><p>Crea una prenda exclusiva.</p><button class="btn" id="design">Diseñar</button></div><div class="card"><div class="hero">🎉</div><h3>Evento VIP</h3><p>Invita creadoras de contenido.</p><button class="btn gold" id="vip">Organizar</button></div><div class="card"><div class="hero">🔄</div><h3>Reiniciar partida</h3><p>Empieza desde cero.</p><button class="btn dark" id="reset">Reiniciar</button></div></div>`);runway.onclick=()=>{if(!spendEnergy(18))return;S.fame+=12;S.money+=900;gainXP(28);toast('💃 Has ganado el desfile');save();renderProfile()};design.onclick=()=>{if(S.money<600)return toast('Necesitas 600 €');if(!spendEnergy(14))return;S.money-=600;S.money+=1500;S.designs++;S.fame+=7;gainXP(25);toast('✂️ Tu prenda exclusiva se ha agotado');save();renderProfile()};vip.onclick=()=>{if(S.money<1800)return toast('Necesitas 1.800 €');S.money-=1800;S.followers+=700;S.fame+=22;gainXP(35);toast('🎉 Evento VIP completado');save();renderProfile()};reset.onclick=()=>{if(confirm('¿Seguro que quieres borrar toda la partida?')){localStorage.removeItem('miaBoutiquePro');location.reload()}}}
function renderMap(){openModal('🗺️ Mapa de Sant Fruitós',`<div class="mapMini"><div class="roadMini one"></div><div class="roadMini two"></div><div class="pin shop">🏪</div><div class="pin home">🏠</div><div class="pin market">📦</div></div><div class="grid" style="margin-top:10px"><button class="card" data-go="town"><div class="hero">🏘️</div><h3>Sant Fruitós</h3><p>Carretera de Vic y el centro.</p></button><button class="card" data-go="shop"><div class="hero">🏪</div><h3>Mía Modas</h3><p>Carretera de Vic, 26.</p></button><button class="card" data-go="warehouse"><div class="hero">📦</div><h3>Almacén</h3><p>Ropa y pedidos online.</p></button><button class="card" data-go="studio"><div class="hero">📸</div><h3>Estudio creativo</h3><p>Fotos y campañas.</p></button><button class="card" data-go="home"><div class="hero">🏠</div><h3>Tu casa</h3><p>Descanso y vestidor.</p></button></div>`);body.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.scene=b.dataset.go;S.x=W/2;S.y=H-90;S.target=null;save();modal.classList.remove('open')})}
doBtn.onclick=interact;mapBtn.onclick=renderMap;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>({fashion:renderFashion,business:renderBusiness,homes:renderHomes,missions:renderMissions,phone:renderPhone,profile:renderProfile}[b.dataset.open]()));setInterval(()=>{S.hour++;if(S.hour>21)S.hour=10;updateUI()},45000);setInterval(save,15000);updateUI();
</script>
</body></html>
