<style>

.actionStack{position:absolute;right:17px;bottom:24px;z-index:8;display:flex;flex-direction:column;gap:10px}.roundBtn{width:58px;height:58px;border-radius:20px;background:rgba(255,250,252,.92);border:1px solid rgba(255,255,255,.95);box-shadow:0 12px 28px rgba(65,33,48,.21);font-size:23px}.roundBtn.primary{background:linear-gradient(145deg,#df6f9b,#a53e69);color:white}

.handle{width:42px;height:5px;border-radius:99px;background:#d9bdc8;margin:0 auto 10px}.sheetHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.sheetHead h2{margin:0;font-size:19px}.close{width:34px;height:34px;border-radius:12px;background:#f5e5eb;font-size:17px}.sub{font-size:11px;opacity:.62;margin:4px 0 13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:12px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 22px rgba(72,34,50,.08)}.card .emoji{font-size:30px}.card h3{margin:7px 0 3px;font-size:13px}.card p{margin:0;font-size:10px;opacity:.62;line-height:1.35}.card .price{margin-top:8px;font-size:12px;font-weight:900;color:#9d3e68}.card button,.wideBtn{width:100%;margin-top:9px;padding:10px;border-radius:12px;background:linear-gradient(135deg,#d56590,#a33c67);color:white;font-weight:900;font-size:11px;box-shadow:0 8px 16px rgba(154,51,94,.23)}.card button:disabled{filter:grayscale(1);opacity:.5}

<body>
<div id="app">

  </nav>
</div>
<div class="sheet" id="sheet"><div class="handle"></div><div id="sheetContent"></div></div>
<div class="start" id="start"><div class="startCard"><div class="startLogo">M</div><h1>Mía Modas</h1><p>Recorre Sant Fruitós, atiende clientas, crea looks, compra ropa y convierte tu boutique de Carretera de Vic, 26 en un imperio de moda.</p><button class="play" onclick="startGame()">ENTRAR EN MI BOUTIQUE ✨</button></div></div>
<script>
const C=document.getElementById('game'),ctx=C.getContext('2d'),wrap=document.getElementById('gameWrap');
let W=0,H=0,dpr=1,last=0,joyX=0,joyY=0,target=null,near=null,started=false;
const state=JSON.parse(localStorage.getItem('miaMobileSave')||'null')||{money:1250,fame:12,energy:100,followers:326,level:1,x:410,y:560,scene:'street',day:1,sales:0,owned:['Mía Modas'],homes:[],stock:{vestido:6,camiseta:8,pantalon:5,bolso:4,zapatos:3},decor:0};
const scenes={
 street:{name:'Carretera de Vic',sub:'Sant Fruitós de Bages · Mía Modas nº 26',w:1500,h:1000},
 shop:{name:'Mía Modas',sub:'Carretera de Vic, 26 · Tu boutique',w:1100,h:800},
 wholesale:{name:'Mayorista de moda',sub:'Compra nueva colección',w:1000,h:760},
 studio:{name:'Estudio creativo',sub:'Fotos, directos y campañas',w:1000,h:760},
 home:{name:'Tu casa',sub:'Descansa y cambia de look',w:1000,h:760}
};
const player={x:state.x,y:state.y,r:18,speed:230};
const interactables={
 street:[{x:340,y:310,w:270,h:150,label:'Entrar en Mía Modas',to:'shop'},{x:820,y:280,w:210,h:145,label:'Ir al mayorista',to:'wholesale'},{x:1110,y:560,w:230,h:155,label:'Entrar al estudio',to:'studio'},{x:160,y:690,w:210,h:150,label:'Ir a casa',to:'home'}],
 shop:[{x:90,y:125,w:210,h:180,label:'Ver nueva colección',action:'shop'},{x:420,y:120,w:220,h:170,label:'Crear un look',action:'wardrobe'},{x:760,y:120,w:220,h:170,label:'Atender clienta',action:'sale'},{x:760,y:480,w:210,h:160,label:'Pedidos online',action:'orders'},{x:70,y:560,w:190,h:130,label:'Salir a la calle',to:'street'}],
 wholesale:[{x:120,y:145,w:230,h:170,label:'Comprar vestidos',action:'buyDresses'},{x:390,y:145,w:230,h:170,label:'Comprar básicos',action:'buyBasics'},{x:660,y:145,w:230,h:170,label:'Comprar complementos',action:'buyAccessories'},{x:70,y:560,w:190,h:130,label:'Volver a la calle',to:'street'}],
 studio:[{x:120,y:130,w:230,h:190,label:'Hacer sesión de fotos',action:'photo'},{x:410,y:130,w:230,h:190,label:'Hacer un directo',action:'live'},{x:700,y:130,w:210,h:190,label:'Crear campaña',action:'campaign'},{x:70,y:560,w:190,h:130,label:'Volver a la calle',to:'street'}],
 home:[{x:130,y:140,w:250,h:190,label:'Descansar',action:'rest'},{x:450,y:140,w:250,h:190,label:'Cambiar de look',action:'wardrobe'},{x:70,y:560,w:190,h:130,label:'Volver a la calle',to:'street'}]
};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=wrap.clientWidth;H=wrap.clientHeight;C.width=W*dpr;C.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function save(){state.x=player.x;state.y=player.y;localStorage.setItem('miaMobileSave',JSON.stringify(state));updateHud()}
function updateHud(){money.textContent=state.money.toLocaleString('es-ES')+' €';fame.textContent='⭐ '+state.fame;energy.textContent='⚡ '+Math.round(state.energy);locName.textContent=scenes[state.scene].name;locSub.textContent=scenes[state.scene].sub}
function startGame(){document.getElementById('start').style.display='none';started=true;updateHud();requestAnimationFrame(loop)}
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function text(t,x,y,size=14,color='#35252d',align='left',weight=700){ctx.fillStyle=color;ctx.font=`${weight} ${size}px ui-rounded,-apple-system`;ctx.textAlign=align;ctx.fillText(t,x,y)}
function camera(){const s=scenes[state.scene];return{x:Math.max(0,Math.min(s.w-W,player.x-W/2)),y:Math.max(0,Math.min(s.h-H,player.y-H/2))}}
function drawStreet(cam){
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#a9d3e6');sky.addColorStop(.48,'#f9d9d4');sky.addColorStop(1,'#e9d6d0');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#81958d';ctx.beginPath();ctx.moveTo(0,145-cam.y*.05);for(let x=0;x<W+90;x+=55)ctx.lineTo(x,95+Math.sin(x*.026)*28-cam.y*.05);ctx.lineTo(W,205);ctx.lineTo(0,205);ctx.fill();
 const ox=-cam.x,oy=-cam.y;ctx.fillStyle='#d8d2ca';ctx.fillRect(ox,180+oy,1500,700);
 ctx.fillStyle='#41434a';ctx.fillRect(ox,405+oy,1500,245);ctx.fillStyle='#63666e';ctx.fillRect(ox,516+oy,1500,3);
 ctx.fillStyle='#fff4c8';for(let x=25;x<1500;x+=150)rounded(x+ox,520+oy,76,7,4,'#fff1a7');
 ctx.fillStyle='#eee9e5';ctx.fillRect(ox,345+oy,1500,60);ctx.fillRect(ox,650+oy,1500,82);
 building(250+ox,195+oy,430,160,'#fff8f5','#b94272','MÍA MODAS','Carretera de Vic, 26');
 building(785+ox,205+oy,280,145,'#f5eee5','#77685e','MAYORISTA','Nueva colección');

 for(let x=70;x<1480;x+=180){tree(x+ox,338+oy);tree(x+70+ox,748+oy)}
 car(690+ox,548+oy,'#f7f7f8');car(1045+ox,455+oy,'#bb4f73');
 text('CARRETERA DE VIC',750+ox,542+oy,15,'rgba(255,255,255,.62)','center',900)

function building(x,y,w,h,body,accent,title,sub){ctx.save();ctx.shadowColor='rgba(63,33,47,.22)';ctx.shadowBlur=18;ctx.shadowOffsetY=10;rounded(x,y,w,h,18,body);ctx.restore();rounded(x,y,w,38,18,accent);ctx.fillStyle=accent;ctx.fillRect(x,y+18,w,20);text(title,x+w/2,y+25,15,'white','center',1000);for(let i=0;i<3;i++){const wx=x+18+i*(w-38)/3;rounded(wx,y+52,(w-58)/3,h-76,10,'#a9d0d9');const g=ctx.createLinearGradient(wx,y,wx+(w-58)/3,y);g.addColorStop(0,'rgba(255,255,255,.46)');g.addColorStop(.45,'rgba(255,255,255,.08)');g.addColorStop(1,'rgba(255,255,255,.22)');ctx.fillStyle=g;ctx.fillRect(wx+4,y+56,(w-58)/3-8,h-84)}rounded(x+10,y+h-27,w-20,22,8,'rgba(255,255,255,.8)');text(sub,x+w/2,y+h-12,10,'#5b414c','center',800)}

 room(70+ox,90+oy,250,215,'#fffaf7','👗','NUEVA COLECCIÓN');room(390+ox,90+oy,280,215,'#fff4f8','🪞','PROBADOR');room(735+ox,90+oy,285,215,'#fbf5ed','🛍️','CAJA & CLIENTAS');room(735+ox,440+oy,285,200,'#f3f7fb','📦','PEDIDOS ONLINE');room(55+ox,535+oy,230,140,'#f2ece8','🚪','SALIDA');

 rounded(788+ox,212+oy,180,50,13,'#cda768');rounded(825+ox,176+oy,82,45,9,'#36313a');text('MÍA POS',866+ox,204+oy,10,'white','center',900);rounded(920+ox,180+oy,28,30,6,'#fff');

function drawInterior(cam,type){const ox=-cam.x,oy=-cam.y;const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,type==='home'?'#fff6f0':'#fff8fb');g.addColorStop(1,type==='home'?'#e8d9ce':'#e4dce2');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.38)';ctx.fillRect(ox,0+oy,1000,760);const arr=interactables[type];arr.forEach((a,i)=>{const colors=type==='studio'?['#fff5f9','#f5f0ff','#fff8ec','#f0ecea']:type==='home'?['#fff3ed','#f8edf3','#eee9e7']:['#fff5f9','#fbf4ec','#eef5fb','#f1ece9'];room(a.x+ox,a.y+oy,a.w,a.h,colors[i%colors.length],i===arr.length-1?'🚪':['📦','👚','👜','📸'][i%4],a.label.toUpperCase())})}

function draw(){const cam=camera();ctx.clearRect(0,0,W,H);if(state.scene==='street')drawStreet(cam);else if(state.scene==='shop')drawShop(cam);else drawInterior(cam,state.scene);drawPlayer(cam)}
function loop(t){if(!started)return;const dt=Math.min((t-last)/1000,.035)||0;last=t;let dx=joyX,dy=joyY;if(target){const vx=target.x-player.x,vy=target.y-player.y,d=Math.hypot(vx,vy);if(d<8)target=null;else{dx=vx/d;dy=vy/d}}
 if(dx||dy){const mag=Math.min(1,Math.hypot(dx,dy));player.x+=dx/mag*player.speed*dt;player.y+=dy/mag*player.speed*dt;state.energy=Math.max(0,state.energy-dt*.25)}
 const s=scenes[state.scene];player.x=Math.max(25,Math.min(s.w-25,player.x));player.y=Math.max(70,Math.min(s.h-25,player.y));checkNear();draw();updateHud();requestAnimationFrame(loop)}
function checkNear(){near=null;for(const a of interactables[state.scene]){const cx=Math.max(a.x,Math.min(player.x,a.x+a.w)),cy=Math.max(a.y,Math.min(player.y,a.y+a.h));if(Math.hypot(player.x-cx,player.y-cy)<65){near=a;break}}const b=document.getElementById('interact');b.classList.toggle('show',!!near);b.textContent=near?near.label:'Entrar'}
function useAction(){if(near)activate(near);else toast('Acércate a una zona marcada ✨')}

function sale(){let total=Object.values(state.stock).reduce((a,b)=>a+b,0);if(!total)return toast('No queda ropa. Ve al mayorista.');const keys=Object.keys(state.stock).filter(k=>state.stock[k]>0),k=keys[Math.floor(Math.random()*keys.length)],gain=25+Math.floor(Math.random()*36);state.stock[k]--;state.money+=gain;state.sales++;state.fame+=1;save();toast('Clienta feliz: +'+gain+' € 🛍️')}
function orders(){if(state.energy<8)return toast('Necesitas descansar');const gain=45+Math.floor(Math.random()*70);state.money+=gain;state.energy-=8;state.followers+=8;save();toast('Pedido preparado: +'+gain+' € 📦')}
function reward(e,f,fol,msg){if(state.energy<Math.abs(e))return toast('No tienes suficiente energía');state.energy+=e;state.fame+=f;state.followers+=fol;state.money+=Math.floor(f*2.4);save();toast(msg)}
function buyPack(k,n,c){if(state.money<c)return toast('No tienes suficiente dinero');state.money-=c;state.stock[k]=(state.stock[k]||0)+n;save();toast('Has comprado '+n+' unidades 👗')}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
// touch movement
C.addEventListener('pointerdown',e=>{const r=C.getBoundingClientRect(),cam=camera();target={x:e.clientX-r.left+cam.x,y:e.clientY-r.top+cam.y}});

function openSheet(type){const s=document.getElementById('sheet'),c=document.getElementById('sheetContent');let h='';
 const head=(t,sub)=>`<div class="sheetHead"><h2>${t}</h2><button class="close" onclick="closeSheet()">✕</button></div><div class="sub">${sub}</div>`;
