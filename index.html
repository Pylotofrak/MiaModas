for(let i=0;i<4;i++){ctx.font='28px serif';ctx.fillText(['👩🏼','👩🏻','👩🏽','👵🏻'][i],110+i*120,455)}ctx.font='34px serif';ctx.fillText(S.avatar,S.x-17,S.y+12);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);S.scene==='town'?drawTown():drawShop();requestAnimationFrame(draw)}draw();
let vx=0,vy=0,drag=false;function joyMove(e){const r=joy.getBoundingClientRect(),p=e.touches?e.touches[0]:e,dx=p.clientX-(r.left+r.width/2),dy=p.clientY-(r.top+r.height/2),m=Math.min(38,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);vx=Math.cos(a)*m/38;vy=Math.sin(a)*m/38;stick.style.transform=`translate(${vx*30}px,${vy*30}px)`}joy.onpointerdown=e=>{drag=true;joy.setPointerCapture(e.pointerId);joyMove(e)};joy.onpointermove=e=>drag&&joyMove(e);joy.onpointerup=()=>{drag=false;vx=vy=0;stick.style.transform=''};setInterval(()=>{if(!drag)return;S.x=Math.max(18,Math.min(622,S.x+vx*5));S.y=Math.max(55,Math.min(620,S.y+vy*5));},30);
function near(){if(S.scene==='shop'){if(S.y<310&&S.x<210)return{kind:'rack',title:'Percheros',text:'Mira toda la ropa y prepara nuevos looks.'};if(S.y<310&&S.x>420)return{kind:'fitting',title:'Probadores',text:'Ayuda a una clienta a elegir su conjunto.'};if(S.y>320&&S.x<230)return{kind:'orders',title:'Pedidos online',text:'Prepara paquetes para tus clientas.'};if(S.y>320&&S.x<410)return{kind:'cash',title:'Caja',text:'Cobra ventas y revisa la recaudación.'};if(S.y>320)return{kind:'photo',title:'Zona de fotos',text:'Haz contenido para Instagram.'};return null}let best=null,d=999;for(const b of buildings){const dd=Math.hypot(S.x-(b.doorX+13),S.y-b.doorY);if(dd<d){d=dd;best=b}}return d<85?best:null}
function showBubble(n){if(!n){bubble.classList.remove('show');return}btitle.textContent=n.title||n.name;btext.textContent=n.text||n.sub;baction.onclick=()=>doAction(n);bubble.classList.add('show')}
interact.onclick=()=>{const n=near();if(!n)return toast('Acércate a una tienda, clienta o zona interactiva');showBubble(n)};
function spendEnergy(n){if(S.energy<n){toast('Necesitas descansar o tomar un café');return false}S.energy-=n;return true}
function progress(type,n=1){if(S.quest.type===type){S.quest.done+=n;if(S.quest.done>=S.quest.goal){S.money+=900;S.fame+=12;toast('🎁 ¡Misión completada! +900 € y +12 fama')}}checkAchievements()}
function doAction(n){bubble.classList.remove('show');const k=n.kind;if(S.scene==='town'&&k==='shop'){S.scene='shop';S.x=320;S.y=560;toast('Has entrado en Mía Modas')}else if(S.scene==='town'&&k==='wholesale')openPanel('fashion','Mayorista de moda');else if(k==='estate')openPanel('homes');else if(k==='studio'){if(spendEnergy(12)){S.photos++;S.followers+=70+Math.floor(Math.random()*90);S.fame+=3;S.money+=140;progress('photos');toast('📸 Sesión preciosa: seguidores y dinero')}}else if(k==='cafe'){if(S.money>=35){S.money-=35;S.energy=Math.min(100,S.energy+42);toast('☕ Energía recuperada')}else toast('No tienes suficiente dinero')}else if(k==='beauty'){openPanel('profile')}else if(k==='park'){S.energy=Math.min(100,S.energy+18);toast('🌳 Has descansado un rato')}else if(k==='rack'||k==='new')openPanel('fashion');else if(k==='fitting'){if(spendEnergy(8)){S.customers++;S.money+=160;S.fame+=2;progress('customers');progress('sales');S.sales++;toast('💖 Clienta encantada: +160 €')}}else if(k==='orders'){if(spendEnergy(10)){S.orders++;S.money+=220;S.followers+=15;progress('orders');progress('sales');S.sales++;toast('📦 Pedido enviado: +220 €')}}else if(k==='cash'){const bonus=80+Object.values(S.stock).reduce((a,b)=>a+b,0)*3;S.money+=bonus;toast(`🧾 Caja revisada: +${bonus} €`)}else if(k==='photo'){if(spendEnergy(9)){S.photos++;S.followers+=100;S.fame+=4;progress('photos');toast('✨ Publicación viral')}}save()}
mapBtn.onclick=()=>openPanel('map');
function openModal(title,html){sheetTitle.textContent=title;sheetBody.innerHTML=html;modal.classList.add('open')}document.querySelector('.close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPanel(b.dataset.open));
function openPanel(type,forced){if(type==='fashion')renderFashion(forced);if(type==='business')renderBusinesses();if(type==='homes')renderHomes();if(type==='missions')renderMissions();if(type==='phone')renderPhone();if(type==='profile')renderProfile();if(type==='map')renderMap()}
function renderFashion(forced){let cat=CATEGORIES[0];const render=()=>{openModal(forced||'👗 Moda y almacén',`<div class="tabs">${CATEGORIES.map(c=>`<button class="${c===cat?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div><div class="wardrobe">${CLOTHES.filter(x=>x[4]===cat).map((x,i)=>{const idx=CLOTHES.indexOf(x),q=S.stock[idx]||0;return`<div class="item"><span class="tag">${x[5]}</span><div class="emo">${x[1]}</div><b>${x[0]}</b><small>Stock: ${q} · Venta ${x[3]} €</small><button class="btn" data-buycloth="${idx}">Comprar ${x[2]} €</button><button class="btn alt" data-sellcloth="${idx}" ${q<1?'disabled':''}>Vender</button></div>`}).join('')}</div>`);document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});document.querySelectorAll('[data-buycloth]').forEach(b=>b.onclick=()=>{const i=+b.dataset.buycloth,c=CLOTHES[i];if(S.money<c[2])return toast('No tienes suficiente dinero');S.money-=c[2];S.stock[i]=(S.stock[i]||0)+1;S.quest.type==='sales'&&0;toast(`Has comprado ${c[0]}`);save();render()});document.querySelectorAll('[data-sellcloth]').forEach(b=>b.onclick=()=>{const i=+b.dataset.sellcloth,c=CLOTHES[i];if(!(S.stock[i]>0))return;S.stock[i]--;S.money+=c[3];S.sales++;S.customers++;S.fame+=1;progress('sales');progress('customers');toast(`Venta realizada: +${c[3]} €`);save();render()})};render()}
function renderBusinesses(){openModal('🏪 Mi imperio de tiendas',`<div class="grid">${BUSINESSES.map(b=>`<div class="card"><div class="hero">${b.icon}</div><h3>${b.name}</h3><p>${b.desc}</p><p class="price">${b.price.toLocaleString()} € · +${b.income} €/día</p><button class="btn" data-biz="${b.id}" ${S.ownedBiz.includes(b.id)?'disabled':''}>${S.ownedBiz.includes(b.id)?'Ya es tuya':'Comprar negocio'}</button></div>`).join('')}</div>`);document.querySelectorAll('[data-biz]').forEach(btn=>btn.onclick=()=>{const b=BUSINESSES.find(x=>x.id===btn.dataset.biz);if(S.money<b.price)return toast('Todavía no tienes suficiente dinero');S.money-=b.price;S.ownedBiz.push(b.id);S.fame+=25;toast(`🎉 Has abierto ${b.name}`);save();renderBusinesses()})}
function renderHomes(){openModal('🏠 Casas y decoración',`<div class="tabs"><button class="on">Viviendas</button><button id="decorTab">Decorar tienda</button></div><div class="grid">${HOMES.map(h=>`<div class="card"><div class="hero">${h.icon}</div><h3>${h.name}</h3><p>${h.desc}</p><p class="price">${h.price.toLocaleString()} € · +${h.income} €/día</p><button class="btn" data-home="${h.id}" ${S.ownedHomes.includes(h.id)?'disabled':''}>${S.ownedHomes.includes(h.id)?'Ya es tuya':'Comprar casa'}</button></div>`).join('')}</div>`);decorTab.onclick=renderDecor;document.querySelectorAll('[data-home]').forEach(btn=>btn.onclick=()=>{const h=HOMES.find(x=>x.id===btn.dataset.home);if(S.money<h.price)return toast('Necesitas ahorrar más');S.money-=h.price;S.ownedHomes.push(h.id);S.fame+=18;S.energy=Math.min(100,S.energy+h.energy);toast(`🔑 Ya tienes ${h.name}`);save();renderHomes()})}
function renderDecor(){openModal('✨ Decora Mía Modas',`<div class="decorRoom"><span class="decorObj" style="left:18px;bottom:18px">🛋️</span><span class="decorObj" style="right:22px;bottom:35px">🪴</span><span class="decorObj" style="left:45%;top:30px">✨</span></div><div class="grid" style="margin-top:10px">${DECOR.map((d,i)=>`<div class="card"><div class="hero">${d[1]}</div><h3>${d[0]}</h3><p class="price">${d[2]} €</p><button class="btn" data-decor="${i}" ${S.decor.includes(i)?'disabled':''}>${S.decor.includes(i)?'Comprado':'Comprar decoración'}</button></div>`).join('')}</div>`);document.querySelectorAll('[data-decor]').forEach(b=>b.onclick=()=>{const i=+b.dataset.decor,d=DECOR[i];if(S.money<d[2])return toast('No tienes suficiente dinero');S.money-=d[2];S.decor.push(i);S.fame+=4;toast('✨ Tu tienda está aún más bonita');save();renderDecor()})}
function renderMissions(){const q=S.quest;openModal('🎯 Misiones, logros y agenda',`<div class="card"><div class="row"><div><h3>Misión del día</h3><p>${questTextFor(q)}</p></div><span class="badge">${q.done>=q.goal?'COMPLETA':'EN CURSO'}</span></div><div class="bar"><i style="width:${Math.min(100,q.done/q.goal*100)}%"></i></div><button class="btn gold" id="claim" ${q.done<q.goal?'disabled':''}>Cobrar premio</button></div><h3>Logros</h3><div class="grid">${[['Primera venta','🧾',S.sales>=1],['Reina de Instagram','📱',S.followers>=2000],['Empresaria','🏪',S.ownedBiz.length>=2],['Casa soñada','🏡',S.ownedHomes.length>=2],['Estilista','👗',Object.values(S.stock).reduce((a,b)=>a+b,0)>=20],['Icono de moda','💎',S.fame>=100]].map(a=>`<div class="achievement ${a[2]?'':'dim'}"><div class="ico">${a[1]}</div><div><b>${a[0]}</b><p>${a[2]?'Conseguido':'Aún bloqueado'}</p></div></div>`).join('')}</div>`);claim.onclick=()=>{if(q.done<q.goal)return;S.money+=1200;S.coins++;newQuest();toast('🎁 Premio cobrado');save();renderMissions()}}
function newQuest(){const types=['customers','sales','photos','orders'];S.quest={type:types[Math.floor(Math.random()*types.length)],goal:3+Math.floor(Math.random()*4),done:0}}
function renderPhone(){openModal('📱 Tu móvil',`<div class="grid"><div class="card"><div class="hero">📸</div><h3>Instagram</h3><p><b>${S.followers.toLocaleString()}</b> seguidores</p><button class="btn" id="post">Publicar look</button></div><div class="card"><div class="hero">📦</div><h3>Pedidos online</h3><p>${S.orders} pedidos enviados</p><button class="btn" id="onlineOrder">Preparar pedido</button></div><div class="card"><div class="hero">🎡</div><h3>Ruleta diaria</h3><p>Monedas: ${S.coins}</p><button class="btn gold" id="spin" ${S.coins<1?'disabled':''}>Girar ruleta</button></div><div class="card"><div class="hero">📅</div><h3>Pasar al día siguiente</h3><p>Cobra ingresos de casas y negocios.</p><button class="btn alt" id="nextDay">Cerrar el día</button></div></div><h3>Calendario de la boutique</h3><div class="calendar">${Array.from({length:28},(_,i)=>`<div class="day ${i+1<S.day?'done':''} ${i+1===S.day?'today':''}">${i+1}</div>`).join('')}</div>`);post.onclick=()=>{if(!spendEnergy(8))return;S.photos++;S.followers+=80+Math.floor(Math.random()*120);S.fame+=3;progress('photos');toast('📱 Tu publicación está funcionando genial');save();renderPhone()};onlineOrder.onclick=()=>{if(!spendEnergy(10))return;S.orders++;S.money+=240;S.sales++;progress('orders');progress('sales');toast('📦 Pedido preparado');save();renderPhone()};spin.onclick=()=>{if(S.coins<1)return;S.coins--;const prizes=[300,500,900,1500];const p=prizes[Math.floor(Math.random()*prizes.length)];S.money+=p;toast(`🎉 Has ganado ${p} €`);save();renderPhone()};nextDay.onclick=nextDay}
function nextDay(){let inc=120;for(const id of S.ownedBiz)inc+=BUSINESSES.find(x=>x.id===id).income;for(const id of S.ownedHomes)inc+=HOMES.find(x=>x.id===id).income;S.money+=inc;S.day++;S.energy=100;S.weather=['☀️','⛅','🌧️','🌤️'][Math.floor(Math.random()*4)];newQuest();toast(`🌅 Nuevo día: ingresos +${inc.toLocaleString()} €`);save();renderPhone()}
function renderProfile(){openModal('💖 Mi vida y mi estilo',`<div class="profile"><div class="avatarBig">${S.avatar}</div><div><h3>Nivel ${S.level}</h3><p>Fama: ${S.fame} · Ventas: ${S.sales}</p><p>Clientas: ${S.customers} · Fotos: ${S.photos}</p><div class="bar"><i style="width:${Math.min(100,S.fame%100)}%"></i></div></div></div><h3>Escoge tu personaje</h3><div class="grid">${['👩🏼','👩🏻','👩🏽','👩🏾','👩🏼‍🦱','👱🏼‍♀️'].map(a=>`<button class="card" data-avatar="${a}" style="font-size:45px">${a}</button>`).join('')}</div><h3>Actividades</h3><div class="grid"><div class="card"><div class="hero">💃</div><h3>Desfile de moda</h3><p>Gana fama con tus mejores looks.</p><button class="btn" id="runway">Participar</button></div><div class="card"><div class="hero">🎨</div><h3>Diseñar colección</h3><p>Crea una prenda exclusiva de Mía.</p><button class="btn" id="design">Diseñar</button></div><div class="card"><div class="hero">🎉</div><h3>Evento VIP</h3><p>Invita influencers a tu boutique.</p><button class="btn gold" id="vip">Organizar</button></div><div class="card"><div class="hero">🧘‍♀️</div><h3>Día de descanso</h3><p>Recupera toda tu energía.</p><button class="btn alt" id="rest">Descansar</button></div></div>`);document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{S.avatar=b.dataset.avatar;save();renderProfile()});runway.onclick=()=>{if(!spendEnergy(18))return;const gain=8+Math.floor(Math.random()*12);S.fame+=gain;S.money+=500;toast(`💃 Desfile perfecto: +${gain} fama`);save();renderProfile()};design.onclick=()=>{if(S.money<800)return toast('Necesitas 800 € para materiales');S.money-=800;S.fame+=10;S.money+=1300;toast('🎨 Tu diseño exclusivo se ha vendido');save();renderProfile()};vip.onclick=()=>{if(S.money<1500)return toast('Necesitas 1.500 €');S.money-=1500;S.followers+=500;S.fame+=20;toast('🎉 Evento VIP: ¡todo Sant Fruitós habla de Mía!');save();renderProfile()};rest.onclick=()=>{S.energy=100;toast('🧘‍♀️ Energía recuperada');save();renderProfile()}}
function renderMap(){openModal('🗺️ Sant Fruitós de Bages',`<div class="grid"><button class="card" id="goTown"><div class="hero">🏘️</div><h3>Calles de Sant Fruitós</h3><p>Pasea por Carretera de Vic y el centro.</p></button><button class="card" id="goShop"><div class="hero">🏪</div><h3>Mía Modas</h3><p>Carretera de Vic, 26.</p></button><button class="card" id="goWholesale"><div class="hero">📦</div><h3>Mayorista</h3><p>Compra nuevas colecciones.</p></button><button class="card" id="goStudio"><div class="hero">📸</div><h3>Estudio Mía</h3><p>Fotos, directos y campañas.</p></button></div>`);goTown.onclick=()=>{S.scene='town';S.x=330;S.y=315;modal.classList.remove('open');save()};goShop.onclick=()=>{S.scene='shop';S.x=320;S.y=555;modal.classList.remove('open');save()};goWholesale.onclick=()=>renderFashion('📦 Mayorista');goStudio.onclick=()=>{modal.classList.remove('open');S.scene='town';S.x=95;S.y=455;save();toast('Has viajado al Estudio Mía')}}
function checkAchievements(){if(S.fame>=100&&!S.achievements.includes('fashion')){S.achievements.push('fashion');toast('🏆 Logro: Icono de moda')}}
setInterval(()=>{if(Math.random()<.12&&S.scene==='shop'){S.customers++;toast('🛍️ Ha entrado una nueva clienta')}},12000);setInterval(save,15000);updateUI();
